<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="一つの具体例から、候補者が確認した送付物と、双方で話す議題をつなぐ HaaS 採用体験デモ。">
  <title>HaaS — 経験のひとコマから、次の会話へ</title>
  <link rel="icon" href="/images/haas-logo.png"><link rel="stylesheet" href="/experience/style.css">
  <link rel="stylesheet" href="/experience/revisions.css">
  <link rel="stylesheet" href="/experience/batch-one.css">
  <link rel="stylesheet" href="/experience/batch-two.css">
</head>
<body>
  <a class="skip" href="#app">本文へ移動</a>
  <header><div class="nav-shell"><a class="brand" href="#candidate/welcome" aria-label="HaaS ホーム"><img src="/images/haas-logo.png" alt="HaaS"><span>経験を届ける。<br>次の会話をつくる。</span></a><nav class="role-switch" aria-label="デモ内の視点"><button data-role="candidate" data-action="to-candidate">候補者の視点</button><button data-role="recruiter" data-action="to-recruiter">人事の視点</button><button data-action="company-settings">会社の設定</button></nav></div></header>
